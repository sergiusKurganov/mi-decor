      // Проявление страницы при заходе — так было в исходной версии: контент скрыт
      // 400 мс, затем проявляется за 0.2 с. Только при первом заходе в сессии и только
      // на экранах шире 980px (за ширину отвечает медиазапрос в стилях).
      //
      // Скрипт обязан быть здесь, до разметки: иначе контент успеет мигнуть.
      (function () {
        var crawler =
          /bot|google|yandex|baidu|bing|msn|duckduckbot|teoma|slurp|crawler|spider|robot|crawling|facebook/i;

        if (crawler.test(navigator.userAgent)) return;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

        try {
          if (sessionStorage.getItem('visited') === 'y') return;
        } catch (error) {
          return;
        }

        var root = document.documentElement;
        root.classList.add('is-entering');
        // Стикеры на главной проявляются по очереди — их отсчёт начинается после
        // того, как проявится сама страница, иначе первые проступят незаметно.
        root.style.setProperty('--appear-base', '620ms');

        document.addEventListener('DOMContentLoaded', function () {
          setTimeout(function () {
            root.classList.remove('is-entering');
            try {
              sessionStorage.setItem('visited', 'y');
            } catch (error) {
              // приватный режим — не беда
            }
          }, 400);
        });
      })();
